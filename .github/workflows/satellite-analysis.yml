name: Manual Satellite Analysis
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'PUBLIC non-sensitive AOI: minLon,minLat,maxLon,maxLat (max 0.5 deg)'
        required: true
        type: string
      before:
        description: 'YYYY-MM-DD/YYYY-MM-DD'
        required: true
        type: string
      after:
        description: 'YYYY-MM-DD/YYYY-MM-DD'
        required: true
        type: string
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-worker.txt
      - name: Analyze public/non-sensitive extent
        env:
          BBOX: ${{ inputs.bbox }}
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after }}
        run: python worker/analyze.py --bbox "$BBOX" --before "$BEFORE" --after "$AFTER" --out outputs/change.geojson
      - name: Import results directly to private review API
        env:
          RSCDS_DEPLOY_URL: ${{ vars.RSCDS_DEPLOY_URL }}
          RSCDS_ADMIN_API_KEY: ${{ secrets.RSCDS_ADMIN_API_KEY }}
        run: |
          if [ -z "$RSCDS_DEPLOY_URL" ] || [ -z "$RSCDS_ADMIN_API_KEY" ]; then
            echo 'Deployment URL variable and admin key secret must be configured in GitHub Settings.' >&2
            exit 2
          fi
          python scripts/import_candidates.py --file outputs/change.geojson
# IMPORTANT: No workflow artifact uploads. Public artifacts could expose protected coordinates.

name: Private Satellite Analysis Queue
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: rscds-analysis-queue
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # The scheduled workflow stays disabled until a Vercel deployment URL is configured.
    if: ${{ vars.RSCDS_DEPLOY_URL != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - name: Securely lease one job (no AOI in inputs or logs)
        id: lease
        env:
          RSCDS_DEPLOY_URL: ${{ vars.RSCDS_DEPLOY_URL }}
          RSCDS_WORKER_API_KEY: ${{ secrets.RSCDS_WORKER_API_KEY }}
        run: python scripts/run_queued_analysis.py --lease-to "$RUNNER_TEMP/rscds_lease.json"
      - name: Install worker dependencies only when there is work
        if: steps.lease.outputs.ready == 'true'
        run: python -m pip install -r requirements-worker.txt
      - name: Process private job
        if: steps.lease.outputs.ready == 'true'
        env:
          RSCDS_DEPLOY_URL: ${{ vars.RSCDS_DEPLOY_URL }}
          RSCDS_WORKER_API_KEY: ${{ secrets.RSCDS_WORKER_API_KEY }}
        run: python scripts/run_queued_analysis.py --process-from "$RUNNER_TEMP/rscds_lease.json"
# Do not add workflow_dispatch location inputs, print job geometry, or upload GeoJSON artifacts.
